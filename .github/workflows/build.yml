name: Build app

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  # Android
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint check
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-release.apk mrlgplayer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: build/app/outputs/flutter-apk/mrlgplayer.apk

  # iOS
  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint check
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Convert .app to .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/Runner.app
          zip -r "$GITHUB_WORKSPACE/mrlgplayer.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-file
          path: mrlgplayer.ipa

  # Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint check
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath mrlgplayer-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: mrlgplayer-windows-x64.zip

  # macOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint check
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/mrlgplayer-macos.zip" *.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-files
          path: mrlgplayer-macos.zip

  # Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl git unzip xz-utils zip ca-certificates jq \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libstdc++-14-dev \
            libsecret-1-dev \
            libepoxy-dev \
            libwayland-dev \
            libwpe-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwpewebkit-2.0-dev=2.48.3-1 \

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"

      - name: Check WPE
        run: |
          pkg-config --modversion wpe-webkit-2.0
          pkg-config --modversion wpebackend-fdo-1.0
          pkg-config --modversion wpe-1.0

      - name: Trust Flutter SDK directory
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Lint check
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Patch flutter_inappwebview_linux
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path '*/flutter_inappwebview_linux-*/linux/CMakeLists.txt' \
            -exec sed -i '/Wno-deprecated-literal-operator/d' {} +

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/mrlgplayer-linux-x64.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-files
          path: mrlgplayer-linux-x64.tar.gz

  # GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest

    needs:
      - build-android
      - build-ios
      - build-windows
      - build-macos
      - build-linux

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate tag
        id: tag
        run: echo "tag=pre-$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pre-release ${{ steps.tag.outputs.tag }}
          prerelease: true
          files: |
            artifacts/mrlgplayer.ipa
            artifacts/mrlgplayer.apk
            artifacts/mrlgplayer-windows-x64.zip
            artifacts/mrlgplayer-macos.zip
            artifacts/mrlgplayer-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
